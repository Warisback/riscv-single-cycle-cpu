<svg viewBox="0 0 1000 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Verification flow of the single-cycle core: sw/smoke.S, the riscv-tests and tools/randgen.py are each assembled by tools/asm2hex.sh into a hex image; each image runs on tb/sc_core_tb.sv with the RTL and on tools/iss.py; the testbench writes its trace from the ret_* ports and its assertions also read 9 internal signals; tools/compare.py compares the two traces and reports PASS or the first mismatch. Unit testbenches and the planted-bug harness sit beside the main loop, and tools/regress_all.sh reruns all of it, with every log in results/.">
  <defs>
    <marker id="vf-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f6b74"/>
    </marker>
    <marker id="vf-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6866"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="404" fill="#ffffff"/>
  <g font-family="Segoe UI, 'Helvetica Neue', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#18201f">

    <!-- step labels -->
    <g font-size="12" fill="#5a6866" font-weight="600">
      <text x="10" y="18">1. Programs</text>
      <text x="184" y="76">2. Build</text>
      <text x="440" y="18">3. Run the same image on both</text>
      <text x="866" y="18">4. Check</text>
    </g>

    <!-- 1. programs -->
    <g text-anchor="middle">
      <rect x="10" y="30" width="150" height="52" rx="4" fill="#ffffff" stroke="#5a6866"/>
      <text x="85" y="52" font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-weight="600">sw/smoke.S</text>
      <text x="85" y="71" font-size="11.5" fill="#5a6866">hand-written</text>

      <rect x="10" y="94" width="150" height="52" rx="4" fill="#ffffff" stroke="#5a6866"/>
      <text x="85" y="116" font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-weight="600">riscv-tests</text>
      <text x="85" y="135" font-size="11.5" fill="#5a6866">40 rv32ui programs</text>

      <rect x="10" y="158" width="150" height="52" rx="4" fill="#e3f1f0" stroke="#0f6b74"/>
      <text x="85" y="180" font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-weight="600">tools/randgen.py</text>
      <text x="85" y="199" font-size="11.5" fill="#5a6866">random, --seed S</text>
    </g>
    <!-- key for the program boxes -->
    <rect x="184" y="27" width="12" height="10" rx="2" fill="#ffffff" stroke="#5a6866"/>
    <text x="202" y="36" font-size="11" fill="#5a6866">self-checking (TOHOST value)</text>
    <rect x="184" y="45" width="12" height="10" rx="2" fill="#e3f1f0" stroke="#0f6b74"/>
    <text x="202" y="54" font-size="11" fill="#5a6866">judged by trace + assertions</text>

    <!-- bus into asm2hex -->
    <g stroke="#0f6b74" stroke-width="1.4" fill="none">
      <path d="M160,56 H172 V184 M160,120 H172 M160,184 H172"/>
      <path d="M172,120 H182" marker-end="url(#vf-arr)"/>
    </g>

    <!-- 2. build -->
    <g text-anchor="middle">
      <rect x="184" y="84" width="112" height="72" rx="4" fill="#ffffff" stroke="#5a6866"/>
      <text x="240" y="105" font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-weight="600">asm2hex.sh</text>
      <text x="240" y="124" font-size="11.5" fill="#5a6866">pcpp, as, ld,</text>
      <text x="240" y="141" font-size="11.5" fill="#5a6866">objcopy, bin2hex</text>

      <rect x="312" y="96" width="84" height="48" rx="4" fill="#f5f7f6" stroke="#5a6866"/>
      <text x="354" y="116" font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-weight="600">prog.hex</text>
      <text x="354" y="134" font-size="11.5" fill="#5a6866">16384 words</text>
    </g>
    <path d="M296,120 H310" stroke="#0f6b74" stroke-width="1.4" fill="none" marker-end="url(#vf-arr)"/>

    <!-- one image, two simulators -->
    <g stroke="#0f6b74" stroke-width="1.4" fill="none">
      <path d="M396,120 H410 M410,102 V262"/>
      <path d="M410,102 H450" marker-end="url(#vf-arr)"/>
      <path d="M410,262 H438" marker-end="url(#vf-arr)"/>
    </g>

    <!-- 3a. RTL testbench -->
    <rect x="440" y="28" width="292" height="170" rx="6" fill="none" stroke="#0f6b74" stroke-width="1.4"/>
    <text x="452" y="46" font-weight="600" fill="#0f6b74"><tspan font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace">tb/sc_core_tb.sv</tspan><tspan font-weight="400" font-size="12" fill="#5a6866">  on Icarus Verilog 12</tspan></text>

    <rect x="452" y="58" width="118" height="132" rx="4" fill="#f5f7f6" stroke="#5a6866"/>
    <g text-anchor="middle">
      <text x="511" y="76" font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-weight="600">rv32i_sc_top</text>
      <text x="511" y="92" font-size="11.5" fill="#5a6866">design under test:</text>
      <text x="511" y="107" font-size="11.5" fill="#5a6866">sc_core + imem</text>
      <text x="511" y="122" font-size="11.5" fill="#5a6866">+ dmem</text>
      <text x="511" y="143" font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#5a6866">ret_* ports</text>
      <text x="511" y="156" font-size="10.5" fill="#5a6866">(trace)</text>
      <text x="511" y="172" font-size="10.5" fill="#5a6866">+ 9 internal probes</text>
      <text x="511" y="185" font-size="10.5" fill="#5a6866">(assertions)</text>
    </g>

    <g text-anchor="middle">
      <rect x="598" y="58" width="124" height="38" rx="4" fill="#e3f1f0" stroke="#0f6b74"/>
      <text x="660" y="74" font-size="12.5" font-weight="600">trace writer</text>
      <text x="660" y="89" font-size="11" fill="#5a6866">from ret_* only</text>

      <rect x="598" y="103" width="124" height="38" rx="4" fill="#e3f1f0" stroke="#0f6b74"/>
      <text x="660" y="119" font-size="12.5" font-weight="600">assertions A1-A5</text>
      <text x="660" y="134" font-size="11" fill="#5a6866">every falling edge</text>

      <rect x="598" y="148" width="124" height="38" rx="4" fill="#e3f1f0" stroke="#0f6b74"/>
      <text x="660" y="164" font-size="12.5" font-weight="600">end of the run</text>
      <text x="660" y="179" font-size="11" fill="#5a6866">TOHOST or timeout</text>
    </g>
    <g stroke="#5a6866" stroke-width="1.2" fill="none">
      <path d="M570,77 H596" marker-end="url(#vf-arr-g)"/>
      <path d="M570,122 H596" marker-end="url(#vf-arr-g)"/>
      <path d="M570,167 H596" marker-end="url(#vf-arr-g)"/>
    </g>

    <!-- 3b. ISS -->
    <rect x="440" y="222" width="292" height="80" rx="6" fill="#ffffff" stroke="#0f6b74" stroke-width="1.4"/>
    <text x="452" y="243" font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-weight="600" fill="#0f6b74">tools/iss.py</text>
    <text x="452" y="262" font-size="11.5" fill="#5a6866">reference model in Python, written from the</text>
    <text x="452" y="278" font-size="11.5" fill="#5a6866">spec: one instruction at a time, no clock;</text>
    <text x="452" y="294" font-size="11.5" fill="#5a6866">same trace format, its own TOHOST verdict</text>

    <!-- outputs -->
    <g text-anchor="middle">
      <rect x="748" y="58" width="100" height="38" rx="4" fill="#f5f7f6" stroke="#5a6866"/>
      <text x="798" y="82" font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="600">rtl.trace</text>

      <rect x="748" y="148" width="100" height="38" rx="4" fill="#ffffff" stroke="#5a6866"/>
      <text x="798" y="164" font-size="12" font-weight="600">PASS / FAIL</text>
      <text x="798" y="179" font-size="10.5" fill="#5a6866">TOHOST=1, 0 fails</text>

      <rect x="748" y="243" width="100" height="38" rx="4" fill="#f5f7f6" stroke="#5a6866"/>
      <text x="798" y="267" font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="600">iss.trace</text>
    </g>
    <g stroke="#0f6b74" stroke-width="1.4" fill="none">
      <path d="M722,77 H746" marker-end="url(#vf-arr)"/>
      <path d="M722,167 H746" marker-end="url(#vf-arr)"/>
      <path d="M732,262 H746" marker-end="url(#vf-arr)"/>
    </g>

    <!-- 4. compare -->
    <g stroke="#0f6b74" stroke-width="1.4" fill="none">
      <path d="M848,77 H928 V108" marker-end="url(#vf-arr)"/>
      <path d="M848,262 H858 V136 H866" marker-end="url(#vf-arr)"/>
    </g>
    <g text-anchor="middle">
      <rect x="868" y="110" width="122" height="50" rx="4" fill="#e3f1f0" stroke="#0f6b74"/>
      <text x="929" y="131" font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-weight="600">compare.py</text>
      <text x="929" y="150" font-size="11.5" fill="#5a6866">line by line</text>

      <rect x="868" y="184" width="122" height="34" fill="#e4f2e8" stroke="#2f7d4a"/>
      <text x="929" y="206" font-size="12" font-weight="600" fill="#2f7d4a">PASS traces match</text>

      <rect x="868" y="218" width="122" height="44" fill="#fbf3e2" stroke="#8a5a00"/>
      <text x="929" y="236" font-size="12" font-weight="600" fill="#8a5a00">or FAIL</text>
      <text x="929" y="253" font-size="11" fill="#8a5a00">first mismatch, line n</text>
    </g>
    <g stroke="#5a6866" stroke-width="1.2" fill="none">
      <path d="M929,160 V182" marker-end="url(#vf-arr-g)"/>
    </g>

    <!-- the rule that joins the three verdicts -->
    <text x="10" y="322" font-size="11.5" fill="#18201f"><tspan font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-weight="600">tools/run_all_sc.sh</tspan> runs this for every program. A program passes only if ISS PASS, RTL PASS (TOHOST = 1, no assertion failed) and identical traces.</text>

    <!-- beside the main loop -->
    <rect x="10" y="334" width="560" height="44" rx="4" fill="#f5f7f6" stroke="#5a6866"/>
    <text x="20" y="352" font-size="11.5"><tspan font-weight="600">Unit level, </tspan><tspan font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="11">tools/run_unit.sh</tspan><tspan fill="#5a6866">: 9 unit testbenches *_tb.sv, each with a reference model,</tspan></text>
    <text x="20" y="369" font-size="11.5" fill="#5a6866">and 6 independent checks *_adv_tb.sv whose oracle is Python, GNU as or the raw image bytes</text>

    <rect x="586" y="334" width="404" height="44" rx="4" fill="#f5f7f6" stroke="#5a6866"/>
    <text x="596" y="352" font-size="11.5"><tspan font-weight="600">Testing the tests, </tspan><tspan font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="11">tools/mutate_sc.sh</tspan><tspan fill="#5a6866">: plant one bug</tspan></text>
    <text x="596" y="369" font-size="11.5" fill="#5a6866">in a copy, rerun 40 riscv-tests + 10 random; the control must pass</text>

    <!-- one script reruns everything -->
    <text x="10" y="397" font-size="11.5" fill="#18201f"><tspan font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-weight="600">tools/regress_all.sh</tspan> (<tspan font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="11">make all</tspan>) reruns all of the above. Every check writes its log to <tspan font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="11">results/</tspan>.</text>
  </g>
</svg>
